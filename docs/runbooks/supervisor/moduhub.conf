; Supervisor da Moduhub: fila, SSR das páginas públicas e relay SMTP. Ver docs/runbooks/deploy.md, "Processos que precisam estar rodando".
;
; Instalar:
;   sudo cp docs/runbooks/supervisor/moduhub.conf /etc/supervisor/conf.d/moduhub.conf
;   (troque /var/www/moduhub e www-data pelo caminho e pelo usuário do PHP-FPM do servidor)
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status
;
; No deploy não precisa mexer aqui: `php artisan queue:restart` e `php artisan inertia:stop-ssr`
; encerram os processos e o Supervisor sobe de novo com o código novo.

[program:moduhub-queue]
command=php /var/www/moduhub/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/moduhub
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
; Dá tempo para o job em andamento terminar antes de matar o processo (emissão de NFS-e, selo do PDF).
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/moduhub/storage/logs/queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:moduhub-ssr]
command=php /var/www/moduhub/artisan inertia:start-ssr
directory=/var/www/moduhub
user=www-data
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
; O SSR chama o `node` (20+). Ajuste se ele não estiver nesses diretórios (nvm instala em ~/.nvm/...).
environment=PATH="/usr/local/bin:/usr/bin:/bin"
redirect_stderr=true
stdout_logfile=/var/www/moduhub/storage/logs/ssr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; Relay relay.moduhub.com.br (Haraka, smtp-relay/). Ver docs/runbooks/email.md, "Relay SMTP".
; Sobe como root só para abrir as portas 587 e 465; o Haraka passa para o usuário `haraka` logo
; depois (smtp-relay/config/smtp.ini). Mudou algo em smtp-relay/: `npm ci --omit=dev` e restart.
[program:moduhub-smtp-relay]
command=/var/www/moduhub/smtp-relay/node_modules/.bin/haraka -c /var/www/moduhub/smtp-relay
directory=/var/www/moduhub/smtp-relay
user=root
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
; Mesmo node 20+ do SSR.
environment=PATH="/usr/local/bin:/usr/bin:/bin"
redirect_stderr=true
stdout_logfile=/var/www/moduhub/storage/logs/smtp-relay.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
